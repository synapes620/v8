name: Build V8 d8
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
    - name: Setup depot_tools
      shell: powershell
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
        "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Get cache week key
      id: week
      shell: powershell
      run: |
        $w = [math]::Floor((Get-Date).DayOfYear / 7)
        "value=$w" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Cache V8 source
      uses: actions/cache@v4
      id: cache-v8
      with:
        path: C:\src
        key: v8-src-${{ runner.os }}-w${{ steps.week.outputs.value }}
        restore-keys: |
          v8-src-${{ runner.os }}-

    - name: Fetch V8 (no-history, skipped on cache hit)
      if: steps.cache-v8.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0
        New-Item -ItemType Directory -Force -Path C:\src | Out-Null
        cd C:\src
        fetch.bat --no-history v8

    - name: Create SDK junction (fake 10.0.28000.0 -> real 10.0.26100.0)
      shell: powershell
      run: |
        $sdkRoot = "C:\Program Files (x86)\Windows Kits\10"
        $avail = (Get-ChildItem "$sdkRoot\Include" |
          Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
          Sort-Object Name -Descending |
          Select-Object -First 1).Name
        Write-Host "Available SDK: $avail"
        $fake = "10.0.28000.0"
        foreach ($sub in @('Include', 'Lib', 'bin')) {
          $src = "$sdkRoot\$sub\$avail"
          $dst = "$sdkRoot\$sub\$fake"
          if ((Test-Path $src) -and !(Test-Path $dst)) {
            New-Item -ItemType Junction -Path $dst -Target $src -Force | Out-Null
            Write-Host "Junction: $sub\$fake -> $sub\$avail"
          }
        }

    - name: Setup Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Patch find_std_rlibs.py (handle empty --rustc-revision)
      shell: powershell
      run: |
        $f = "C:\src\v8\build\rust\std\find_std_rlibs.py"
        $c = Get-Content $f -Raw
        Write-Host "Current --rustc-revision definition:"
        Select-String -InputObject $c -Pattern "rustc.revision" | ForEach-Object { Write-Host $_.Line }

        $old = "add_argument('--rustc-revision'"
        $new = "add_argument('--rustc-revision', nargs='?', default='', const=''"
        $c2 = $c.Replace($old, $new)

        if ($c2 -eq $c) {
          Write-Error "Pattern not found in find_std_rlibs.py - check output above"
          exit 1
        }
        Set-Content $f $c2 -Encoding utf8
        Write-Host "Patched find_std_rlibs.py"

    - name: Build d8
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0

        $rustSysroot = (rustc --print sysroot 2>&1).Trim() -replace '\\', '/'
        Write-Host "Rust sysroot: $rustSysroot"

        $outDir = "C:\src\v8\out\x64.release"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $l1 = 'is_debug = false'
        $l2 = 'target_cpu = "x64"'
        $l3 = 'rust_sysroot_absolute = "' + $rustSysroot + '"'
        "$l1`n$l2`n$l3" | Set-Content -Path "$outDir\args.gn" -Encoding ascii

        Write-Host "=== args.gn ==="
        Get-Content "$outDir\args.gn"

        cd C:\src\v8
        gn.bat gen $outDir
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ninja.bat -C $outDir d8

    - name: Show build errors
      if: failure()
      shell: powershell
      run: |
        $out = "C:\src\v8\out\x64.release"
        foreach ($f in @("siso_output", ".ninja_log")) {
          $p = "$out\$f"
          if (Test-Path $p) {
            Write-Host "=== $f (last 150 lines) ==="
            Get-Content $p -Tail 150
          }
        }

    - name: Upload d8
      uses: actions/upload-artifact@v4
      with:
        name: d8-win-x64
        path: C:\src\v8\out\x64.release\d8.exe
