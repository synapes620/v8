name: Build V8 d8
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
    - name: Setup depot_tools
      shell: powershell
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
        "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Get cache week key
      id: week
      shell: powershell
      run: |
        $w = [math]::Floor((Get-Date).DayOfYear / 7)
        "value=$w" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Cache V8 source
      uses: actions/cache@v4
      id: cache-v8
      with:
        path: C:\src
        key: v8-src-${{ runner.os }}-w${{ steps.week.outputs.value }}
        restore-keys: |
          v8-src-${{ runner.os }}-

    - name: Fetch V8 (no-history, skipped on cache hit)
      if: steps.cache-v8.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0
        New-Item -ItemType Directory -Force -Path C:\src | Out-Null
        Set-Location C:\src
        # Write .gclient directly (gclient config --spec passes through cmd.exe which
        # strips all double-quotes, producing invalid Python and "syntax error in .gclient")
        $gclientContent = @"
solutions = [
  {
    "name": "v8",
    "url": "https://chromium.googlesource.com/v8/v8.git",
    "deps_file": "DEPS",
    "custom_deps": {},
  }
]
"@
        Set-Content -Path "C:\src\.gclient" -Value $gclientContent -Encoding ascii
        Write-Host "=== .gclient written ==="
        Get-Content "C:\src\.gclient"
        # --jobs 4 to prevent the gsutil lock race (error code 6) on cache miss
        gclient.bat sync --no-history --with_branch_heads --jobs 4

    - name: Create SDK junction (fake 10.0.28000.0 -> real 10.0.26100.0)
      shell: powershell
      run: |
        $sdkRoot = "C:\Program Files (x86)\Windows Kits\10"
        $avail = (Get-ChildItem "$sdkRoot\Include" |
          Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
          Sort-Object Name -Descending |
          Select-Object -First 1).Name
        Write-Host "Available SDK: $avail"
        $fake = "10.0.28000.0"
        foreach ($sub in @('Include', 'Lib', 'bin')) {
          $src = "$sdkRoot\$sub\$avail"
          $dst = "$sdkRoot\$sub\$fake"
          if ((Test-Path $src) -and !(Test-Path $dst)) {
            New-Item -ItemType Junction -Path $dst -Target $src -Force | Out-Null
            Write-Host "Junction: $sub\$fake -> $sub\$avail"
          }
        }

    - name: Patch Windows SDK headers (inject missing minwinbase.h include)
      shell: powershell
      run: |
        # SDK 10.0.26100.0: fileapi.h(1081) and winbase.h use FILE_INFO_BY_HANDLE_CLASS
        # but that type lives in minwinbase.h which is not always transitively included.
        # Clang-cl is stricter than MSVC about header ordering; patch both files.
        $sdkInc = "C:\Program Files (x86)\Windows Kits\10\include\10.0.28000.0\um"
        foreach ($name in @("fileapi.h", "winbase.h")) {
          $f = "$sdkInc\$name"
          if (!(Test-Path $f)) { Write-Host "Not found: $f"; continue }
          $raw = [System.IO.File]::ReadAllBytes($f)
          $c = [System.Text.Encoding]::UTF8.GetString($raw)
          if ($c -match '#include\s*[<"]minwinbase\.h[>"]') {
            Write-Host "$name`: already includes minwinbase.h - skipping"
            continue
          }
          # Insert right after the first #pragma once (keep existing line endings)
          $patched = $c -replace '(#pragma once[^\r\n]*[\r\n]+)', ('$1#include <minwinbase.h>'+"`r`n")
          if ($patched -eq $c) {
            # No pragma once found - prepend
            $patched = "#include <minwinbase.h>`r`n" + $c
          }
          [System.IO.File]::WriteAllText($f, $patched, [System.Text.Encoding]::ASCII)
          Write-Host "Patched: $name"
        }

    - name: Setup Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: x86_64-pc-windows-msvc

    - name: Patch sandbox testing for Windows (remove Linux-only crash filter restriction)
      shell: powershell
      run: |
        $f = "C:\src\v8\src\sandbox\testing.cc"
        $c = Get-Content $f -Raw
        Write-Host "Lines mentioning Linux in testing.cc:"
        Select-String -InputObject $c -Pattern "Linux" | ForEach-Object { Write-Host $_.Line }
        $old = 'FATAL("The sandbox crash filter is currently only available on Linux");'
        $new = '// Sandbox crash filter not supported on Windows - skip'
        $c2 = $c.Replace($old, $new)
        if ($c2 -ne $c) {
          Set-Content $f $c2 -Encoding utf8
          Write-Host "Patched sandbox testing.cc"
        } else {
          Write-Host "Pattern not found - check lines above for exact string"
        }

    - name: Patch find_std_rlibs.py (handle empty --rustc-revision if present)
      shell: powershell
      run: |
        $f = "C:\src\v8\build\rust\std\find_std_rlibs.py"
        # Base64-encoded Python patcher (avoids YAML/PowerShell quote escaping issues)
        $b64 = ""
        python3 -I -c "import base64,sys; open('C:/patch_rlibs.py','w').write(base64.b64decode('$b64').decode())"
        python3 -I "C:\patch_rlibs.py" "$f"

    - name: Build d8
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $env:DEPOT_TOOLS_WIN_TOOLCHAIN = 0

        $rustSysroot = (rustc --print sysroot 2>&1).Trim() -replace '\\', '/'
        Write-Host "Rust sysroot: $rustSysroot"

        $outDir = "C:\src\v8\out\x64.release"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $l1 = 'is_debug = false'
        $l2 = 'target_cpu = "x64"'
        $l3 = 'rust_sysroot_absolute = "' + $rustSysroot + '"'
        $l4 = 'v8_enable_memory_corruption_api = true'
        # Force-include minwinbase.h to fix FILE_INFO_BY_HANDLE_CLASS with Clang-cl
        # (fileapi.h uses it but doesn't include its defining header in SDK 10.0.26100.0)
        $l5 = 'extra_cflags = "/FIminwinbase.h"'
        "$l1`n$l2`n$l3`n$l4`n$l5" | Set-Content -Path "$outDir\args.gn" -Encoding ascii

        Write-Host "=== args.gn ==="
        Get-Content "$outDir\args.gn"

        cd C:\src\v8
        gn.bat gen $outDir
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ninja.bat -C $outDir d8

    - name: Show build errors
      if: failure()
      shell: powershell
      run: |
        $out = "C:\src\v8\out\x64.release"
        foreach ($f in @("siso_output", ".ninja_log")) {
          $p = "$out\$f"
          if (Test-Path $p) {
            Write-Host "=== $f (last 150 lines) ==="
            Get-Content $p -Tail 150
          }
        }

    - name: Upload d8
      uses: actions/upload-artifact@v4
      with:
        name: d8-win-x64
        path: C:\src\v8\out\x64.release\d8.exe
